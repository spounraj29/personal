spring.application.name:rest-example
server:
  port: 8081  # Port for the REST API
  https:
    enabled: true  # Enable HTTPS
    port: 8443  # Port for HTTPS
    key-store: classpath:keystore.p12  # Path to the keystore file
    key-store-password: changeit  # Password for the keystore
    key-store-type: PKCS12  # Type of the keystore
    key-alias: myalias  # Alias for the key in the keystore 
  servlet:
    context-path: /api  # Context path for the REST API 
logging:
  level:
    org.springframework.web: DEBUG  # Enable debug logging for Spring Web
    org.springframework.boot: INFO  # Set logging level for Spring Boot
    com.example.rest: DEBUG  # Enable debug logging for your application package